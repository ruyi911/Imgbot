[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgbot"
version = "0.1.0"
description = "One Telegram photo logging bot per group"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "SQLAlchemy>=2.0.40,<3",
  "greenlet>=3.2,<4",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.9,<3",
  "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
imgbot = "imgbot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
